name: "Vprofile IAC"

on:
  push:
    branches: [main, stage]
    paths:
      - terraform/**
      - .github/workflows/terraform.yml
  pull_request:
    branches: [main]
    paths:
      - terraform/**
      - .github/workflows/terraform.yml
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to run"
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy

concurrency:
  group: terraform-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

  # S3 bucket for the Terraform state (kept in GitHub Secrets)
  BUCKET_TF_STATE: ${{ secrets.BUCKET_TF_STATE }}

  # Region for AWS API calls
  AWS_REGION: us-east-1
  AWS_DEFAULT_REGION: us-east-1

  # Cluster name used after apply
  EKS_CLUSTER: vprofile-eks

jobs:
  terraform:
    name: "Terraform"
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: ./terraform

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform (pinned)
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform init
        id: init
        run: terraform init -upgrade -reconfigure -backend-config="bucket=$BUCKET_TF_STATE"

      - name: Terraform format
        id: fmt
        run: terraform fmt -check -recursive

      - name: Terraform validate
        id: validate
        run: terraform validate

      # PLAN runs automatically on PRs and pushes.
      - name: Terraform plan
        id: plan
        if: github.event_name != 'workflow_dispatch' || inputs.action == 'plan'
        run: terraform plan -no-color -input=false -out=planfile

      - name: Upload plan artifact
        if: (github.event_name != 'workflow_dispatch' || inputs.action == 'plan')
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}
          path: terraform/planfile

      # APPLY is manual only (workflow_dispatch) and runs only on main.
      - name: Terraform apply (manual)
        id: apply
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply' && github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve -input=false -parallelism=1 planfile

      # DESTROY is manual only (workflow_dispatch) and runs only on main.
      - name: Terraform destroy (manual)
        id: destroy
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy' && github.ref == 'refs/heads/main'
        run: terraform destroy -auto-approve -input=false

      - name: Get Kube config file
        id: getconfig
        if: steps.apply.outcome == 'success'
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER }}

      - name: Install Ingress controller
        if: steps.apply.outcome == 'success' && steps.getconfig.outcome == 'success'
        run: kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.1.3/deploy/static/provider/aws/deploy.yaml

  # Separate job with environment protection for APPLY/DESTROY.
  # You must create an environment named "production" in GitHub repo settings and require approvals.
  protected_gate:
    name: "Protected gate (manual apply/destroy)"
    if: github.event_name == 'workflow_dispatch' && (inputs.action == 'apply' || inputs.action == 'destroy')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Gate
        run: echo "Approved to run ${{ inputs.action }} on ${{ github.ref }}"