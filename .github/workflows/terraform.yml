jobs:
  terraform_ci:
    name: "Terraform (fmt/validate/plan)"
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: ./terraform

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform (pinned)
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform init
        id: init
        run: terraform init -upgrade -reconfigure -backend-config="bucket=$BUCKET_TF_STATE"

      - name: Terraform format
        id: fmt
        run: terraform fmt -check -recursive

      - name: Terraform validate
        id: validate
        run: terraform validate

      # PLAN runs automatically on PRs and pushes, and also runs for manual APPLY (so planfile exists).
      - name: Terraform plan
        id: plan
        if: github.event_name != 'workflow_dispatch' || inputs.action == 'plan' || inputs.action == 'apply'
        run: terraform plan -no-color -input=false -out=planfile

      - name: Upload plan artifact
        if: github.event_name != 'workflow_dispatch' || inputs.action == 'plan' || inputs.action == 'apply'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}
          path: terraform/planfile

  terraform_cd:
    name: "Terraform (apply/destroy)"
    needs: terraform_ci
    runs-on: ubuntu-latest

    # This is the REAL protection. It will pause for approval because of the environment.
    environment: production

    # Only manual runs, only on main, only apply/destroy.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.action == 'apply' || inputs.action == 'destroy')

    defaults:
      run:
        shell: bash
        working-directory: ./terraform

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform (pinned)
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform init
        id: init
        run: terraform init -upgrade -reconfigure -backend-config="bucket=$BUCKET_TF_STATE"

      - name: Download plan artifact
        if: inputs.action == 'apply'
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}
          path: terraform

      - name: Terraform apply (manual)
        id: apply
        if: inputs.action == 'apply'
        run: terraform apply -auto-approve -input=false -parallelism=1 planfile

      - name: Terraform destroy (manual)
        id: destroy
        if: inputs.action == 'destroy'
        run: terraform destroy -auto-approve -input=false

      - name: Get Kube config file
        id: getconfig
        if: steps.apply.outcome == 'success'
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER }}

      - name: Install Ingress controller
        if: steps.apply.outcome == 'success' && steps.getconfig.outcome == 'success'
        run: kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.1.3/deploy/static/provider/aws/deploy.yaml